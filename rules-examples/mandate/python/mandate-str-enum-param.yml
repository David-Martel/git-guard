# Quality mandate PY-04 (typed enums, never strings as enumerations). Read by
# hooks/common/mandate_scan.sh under `mandate.str_enum_param` (default:
# changed). Ported from vigil-spark ast-grep-rules/python/py-no-str-enum-param.yml
# with its path scope removed (the mandate applies account-wide).
#
# Sources: clarius CLAUDE.md:420-422 ("Typed enums, never strings or raw
# numbers for modes/states/kinds/identity ... Parse foreign raw values ... into
# enums at the boundary"); vigil-spark AGENTS.md:200.
#
# Heuristic: a parameter whose NAME reads as an enumerated concept
# (mode/state/kind/status/type/level/role/phase/cmd/command/action/stage/
# backend/distro/arch) and whose TYPE is a raw str/int. Physical and transport
# names (timeout_s, depth, port, count, ...) never match the name alternation.
# Unlike the vigil-spark original, a parameter with a default
# (`mode: str = "fast"`, a typed_default_parameter) is matched too.
id: mandate-str-enum-param
language: python
severity: warning
message: "Enumerated concept typed as raw str/int — use an Enum and parse at the boundary"
rule:
  any:
    - kind: typed_parameter
    - kind: typed_default_parameter
  all:
    - has:
        field: type
        regex: '^(str|int|Optional\[str\]|Optional\[int\]|str \| None|int \| None)$'
    - has:
        kind: identifier
        regex: '(?i)^(_)?([a-z0-9_]*_)?(mode|state|kind|status|type|level|role|phase|cmd|command|action|stage|backend|distro|arch)$'
note: |
  Define the closed set once and annotate with it:
    class Mode(StrEnum):
        FAST = "fast"
        SAFE = "safe"
    def run(mode: Mode) -> None: ...
  Parse foreign values at the boundary: Mode(raw) raises ValueError on a typo.
  Genuinely free-form text (a log level string handed to a library that takes
  str) is recorded on the line:
    def f(level: str):  # ast-grep-ignore: mandate-str-enum-param  # SAFETY: passed through to logging.setLevel
