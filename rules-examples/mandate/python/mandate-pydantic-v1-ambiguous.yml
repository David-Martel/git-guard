# Quality mandate PY-01, ambiguous half. Read by hooks/common/mandate_scan.sh
# under `mandate.pydantic_v1_ambiguous` (default: warn).
#
# `.dict()` and `.copy(update=...)` are pydantic v1 model methods, but the same
# names exist on unrelated objects (a dataclass helper, a custom mapping), so a
# structural match cannot tell a v1 call from a legitimate one. That is why this
# half warns by default instead of blocking. mandate_scan.py also classifies
# unresolved parse_obj/parse_raw/parse_file/from_orm receivers under this key;
# those candidates come from mandate-pydantic-v1.yml so disabling this warning
# cannot disable a proven model's strong rule. Namespace/decorator/Config
# findings remain strong, and verified plain parser methods are not findings.
id: mandate-pydantic-v1-ambiguous
language: python
severity: warning
message: "Possible Pydantic v1 method — receiver ownership is unresolved"
rule:
  kind: call
  any:
    - has:
        field: function
        kind: attribute
        has:
          field: attribute
          regex: '^dict$'
    - all:
        - has:
            field: function
            kind: attribute
            has:
              field: attribute
              regex: '^copy$'
        - has:
            field: arguments
            has:
              kind: keyword_argument
              has:
                field: name
                regex: '^update$'
note: |
  If the receiver is a pydantic model:
    model.dict(...)              -> model.model_dump(...)
    model.copy(update={...})     -> model.model_copy(update={...})
  If it is not, record that on the line:
    x.dict()  # ast-grep-ignore: mandate-pydantic-v1-ambiguous  # SAFETY: <receiver> is not a pydantic model
