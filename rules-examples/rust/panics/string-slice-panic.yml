id: string-slice-panic
message: String/slice operations can panic on invalid indices - use safe methods
severity: error
language: rust
rule:
  any:
  - pattern: $STR[$START..$END]
  - pattern: $STR[..$END]
  - pattern: $STR[$START..]
  # Unit tests live in `#[cfg(test)] mod tests` INSIDE the source file, so the
  # `!**/tests/**` path glob cannot see them. Without this clause the rule reports
  # test code as production risk: on vigil_device_resources that was 87 findings
  # where only 1 was real, which is noise, not a gate.
  not:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
note: 'Use safe alternatives:

  - str.get(start..end).ok_or(Error::InvalidRange)?

  - String operations: chars(), split(), etc.


  String slicing must be on UTF-8 character boundaries.

  '


