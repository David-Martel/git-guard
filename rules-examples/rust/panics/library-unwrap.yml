id: library-unwrap
message: Library code should not use unwrap() - propagate errors to caller
severity: error
language: rust
rule:
  pattern: $EXPR.unwrap()
  # Unit tests live in `#[cfg(test)] mod tests` INSIDE the source file, so the
  # `!**/tests/**` path glob cannot see them. Without this clause the rule reports
  # test code as production risk: on vigil_device_resources that was 87 findings
  # where only 1 was real, which is noise, not a gate.
  not:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
files:
  - "**/src/**/*.rs"
  - "!**/tests/**"
  - "!**/*_test.rs"
  - "!**/test_*.rs"
  - "!**/_backup*/**"
note: |
  Library code should propagate errors using ? or return Result.
  Only use unwrap() in:
  - Test code
  - Example code
  - After explicit checks that guarantee success
