id: fixed-size-init
message: Fixed-size initialization can panic if size is wrong - validate size
severity: info
language: rust
rule:
  pattern: 'let $VAR: [$TYPE; $SIZE] = $INIT;

    '
  # Unit tests live in `#[cfg(test)] mod tests` INSIDE the source file, so the
  # `!**/tests/**` path glob cannot see them. Without this clause the rule reports
  # test code as production risk: on vigil_device_resources that was 87 findings
  # where only 1 was real, which is noise, not a gate.
  not:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
note: 'Ensure the initialization matches the declared size.

  Consider using Vec or validating length at runtime.

  '


