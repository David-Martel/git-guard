id: unsafe-with-panic
message: Unsafe block contains panic-inducing code - ensure safety invariants
severity: error
language: rust
rule:
  kind: unsafe_block
  has:
    any:
    - pattern: panic!($$$)
    - pattern: $X.unwrap()
    - pattern: $X.expect($_)
    - pattern: unimplemented!($$$)
    - pattern: todo!($$$)
    stopBy: end
  # Unit tests live in `#[cfg(test)] mod tests` INSIDE the source file, so the
  # `!**/tests/**` path glob cannot see them. Without this clause the rule reports
  # test code as production risk: on vigil_device_resources that was 87 findings
  # where only 1 was real, which is noise, not a gate.
  not:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
note: 'Unsafe blocks should not contain panicking code.

  Either handle errors properly or document why panic is safe here.

  '


