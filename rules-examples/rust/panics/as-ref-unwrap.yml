id: as-ref-unwrap
message: Chaining as_ref().unwrap() can panic - use pattern matching or ?
severity: error
language: rust
rule:
  pattern: $EXPR.as_ref().unwrap()
  # Unit tests live in `#[cfg(test)] mod tests` INSIDE the source file, so the
  # `!**/tests/**` path glob cannot see them. Without this clause the rule reports
  # test code as production risk: on vigil_device_resources that was 87 findings
  # where only 1 was real, which is noise, not a gate.
  not:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
fix: '$EXPR.as_ref().ok_or(Error::NoneValue)?

  '
note: "Better pattern:\nmatch &$EXPR {\n    Some(ref val) => val,\n    None => return\
  \ Err(Error::NoneValue),\n}\n"


