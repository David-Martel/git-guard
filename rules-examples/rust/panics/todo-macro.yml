id: todo-macro
message: todo!() will panic at runtime - implement or return error
severity: warning
language: rust
rule:
  pattern: todo!($$$ARGS)
  # Unit tests live in `#[cfg(test)] mod tests` INSIDE the source file, so the
  # `!**/tests/**` path glob cannot see them. Without this clause the rule reports
  # test code as production risk: on vigil_device_resources that was 87 findings
  # where only 1 was real, which is noise, not a gate.
  not:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
files:
  - "**/src/**/*.rs"
  - "!**/tests/**"
  - "!**/*_test.rs"
  - "!**/test_*.rs"
  - "!**/_backup*/**"
note: |
  todo!() panics at runtime. Consider:
  - Implementing the functionality
  - Returning an error: anyhow::bail!("not yet implemented")
  - Using a Result return type
