id: unimplemented-macro
message: unimplemented!() will panic at runtime - replace with proper error or Result
severity: warning
language: rust
rule:
  pattern: unimplemented!($$$ARGS)
  # Unit tests live in `#[cfg(test)] mod tests` INSIDE the source file, so the
  # `!**/tests/**` path glob cannot see them. Without this clause the rule reports
  # test code as production risk: on vigil_device_resources that was 87 findings
  # where only 1 was real, which is noise, not a gate.
  not:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
files:
  - "**/src/**/*.rs"
  - "!**/tests/**"
  - "!**/*_test.rs"
  - "!**/test_*.rs"
  - "!**/_backup*/**"
note: |
  unimplemented!() panics at runtime. Consider:
  - Return Result with a descriptive error
  - Use anyhow::bail!("not yet implemented: ...")
  - Document why it's deferred
