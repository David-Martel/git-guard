id: expect-call
message: expect() will panic on None/Err - prefer ? operator or proper error handling
severity: warning
language: rust
rule:
  pattern: $EXPR.expect($MSG)
  # Unit tests live in `#[cfg(test)] mod tests` INSIDE the source file, so the
  # `!**/tests/**` path glob cannot see them. Without this clause the rule reports
  # test code as production risk: on vigil_device_resources that was 87 findings
  # where only 1 was real, which is noise, not a gate.
  not:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
files:
  - "**/src/**/*.rs"
  - "!**/tests/**"
  - "!**/*_test.rs"
  - "!**/test_*.rs"
  - "!**/_backup*/**"
note: |
  Example fix:
  Before: value.expect("Should have value")
  After:  value.ok_or_else(|| anyhow::anyhow!("Should have value"))?
