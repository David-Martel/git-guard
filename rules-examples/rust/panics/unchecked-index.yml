id: unchecked-index
message: Indexing without bounds check can panic - use get() or check bounds first
severity: error
language: rust
rule:
  any:
  - pattern: $ARRAY[$INDEX]
  # `- pattern: $VEC[$INDEX]` REMOVED 2026-08-15: structurally identical to the line
  # above (both match any expression followed by a subscript), so it never matched
  # independently, but it bound a metavar the `fix:` does not re-emit -- the signature
  # of the dropped-metavar corruption class. Verified harmless before removal.
  # Unit tests live in `#[cfg(test)] mod tests` INSIDE the source file, so the
  # `!**/tests/**` path glob cannot see them. Without this clause the rule reports
  # test code as production risk: on vigil_device_resources that was 87 findings
  # where only 1 was real, which is noise, not a gate.
  not:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
constraints:
  ARRAY:
    not:
      regex: ^(slice|arr|buffer)
fix: '$ARRAY.get($INDEX).ok_or(Error::IndexOutOfBounds)?

  '
note: "Example fix:\nBefore: let item = vec[index];\nAfter:  let item = vec.get(index).ok_or(Error::IndexOutOfBounds)?;\n\
  \nOr with bounds check:\nif index < vec.len() {\n    let item = vec[index];\n}\n"


