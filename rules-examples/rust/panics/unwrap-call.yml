id: unwrap-call
message: unwrap() will panic on None/Err - use ? operator or explicit error handling
severity: error
language: rust
rule:
  pattern: $EXPR.unwrap()
  # Unit tests live in `#[cfg(test)] mod tests` INSIDE the source file, so the
  # `!**/tests/**` path glob cannot see them. Without this clause the rule reports
  # test code as production risk: on vigil_device_resources that was 87 findings
  # where only 1 was real, which is noise, not a gate.
  not:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
files:
  - "**/src/**/*.rs"
  - "!**/tests/**"
  - "!**/*_test.rs"
  - "!**/test_*.rs"
  - "!**/_backup*/**"
fix: |-
  $EXPR?
note: |
  Example fixes:
  1. Use ? operator: value.some_method()?
  2. Use unwrap_or: value.unwrap_or(default)
  3. Use unwrap_or_else: value.unwrap_or_else(|| compute_default())
  4. Match explicitly:
     match value {
         Some(v) => v,
         None => return Err(Error::ValueMissing),
     }
