id: unchecked-division
message: Division can panic on zero - add zero check or use checked_div
severity: error
language: rust
rule:
  pattern: $EXPR / $DIVISOR
  # Unit tests live in `#[cfg(test)] mod tests` INSIDE the source file, so the
  # `!**/tests/**` path glob cannot see them. Without this clause the rule reports
  # test code as production risk: on vigil_device_resources that was 87 findings
  # where only 1 was real, which is noise, not a gate.
  not:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
constraints:
  DIVISOR:
    not:
      kind: integer_literal
fix: '$EXPR.checked_div($DIVISOR).ok_or(Error::DivisionByZero)?

  '
note: 'Example fix:

  Before: let result = a / b;

  After:  let result = a.checked_div(b).ok_or(Error::DivisionByZero)?;

  '


