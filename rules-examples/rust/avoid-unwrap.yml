id: avoid-unwrap
language: Rust
severity: warning
message: "Avoid unwrap() in production code - use ? operator or proper error handling"
rule:
  pattern: "$EXPR.unwrap()"
  # Unit tests live in `#[cfg(test)] mod tests` INSIDE the source file, so the
  # `!**/tests/**` path glob cannot see them. Without this clause the rule reports
  # test code as production risk: on vigil_device_resources that was 87 findings
  # where only 1 was real, which is noise, not a gate.
  not:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
files:
  - "**/src/**/*.rs"
  - "!**/tests/**"
  - "!**/*_test.rs"
  - "!**/test_*.rs"
  - "!**/_backup*/**"
note: |
  unwrap() panics on None/Err. Preferred alternatives:
  1. Use ? operator: $EXPR?
  2. Use unwrap_or: $EXPR.unwrap_or(default)
  3. Use unwrap_or_else: $EXPR.unwrap_or_else(|| default)
  4. Use anyhow context: $EXPR.context("description")?
  Do NOT auto-fix to expect("TODO: ...") — that creates tech debt.
