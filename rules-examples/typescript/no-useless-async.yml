id: no-useless-async
language: TypeScript
severity: info
message: "Remove async from functions without await"
rule:
  all:
  - pattern: "async function $NAME($PARAMS) { $BODY }"
  - not:
      has:
        pattern: "await $EXPR"
note: |
  An async function with no await still wraps its result in a Promise. Callers
  must await it, its errors arrive as rejections instead of throws, and readers
  assume I/O that is not there. Remove async, or add the missing await.
