id: no-hardcoded-secrets
language: TypeScript
severity: error
message: "Potential hardcoded secret detected - use environment variables"
rule:
  any:
  - pattern: const $NAME = $STRING
  - pattern: let $NAME = $STRING
constraints:
  NAME:
    regex: "(?i)(password|secret|api_key|apikey|token|auth)"
  STRING:
    regex: "^[\"'].*[\"']$"
note: "Secrets should be loaded from environment variables or secure vaults"
