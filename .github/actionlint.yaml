# actionlint configuration.
#
# git-guard's QA workflow deliberately targets a repo-local self-hosted runner rather
# than GitHub-hosted minutes. actionlint cannot know about custom runner labels, so
# without this it reports `label "git-guard-local" is unknown` on every job and the
# real findings get lost in the noise.
#
# Keep this list in sync with the role labels the runners register with:
# `git-guard-local` (native job: vigil1's ci-runners/vigil1/runners/git-guard-1.env, rootless
# podman with no daemon, plus asuspro13's repo-runners/git-guard.yml while it lasts) and
# `git-guard-docker` (Docker job: a dedicated rootless engine, currently on dtm-work).
self-hosted-runner:
  labels:
    - git-guard-local
    - docker
    - vigil1
    - git-guard-docker
