# git-guard QA gate — GLOBAL DEFAULT config (account-wide).
#
# Format: flat KEY=VALUE, one per line, '#' comments, no sections, no quotes
# needed. Parsed by a grep/sed reader in qa_gate.sh — NO toml/python parser runs
# in the commit hot path. A per-repo file (repo-root `.qa-gate.conf`, or
# `.git-guard/qa-gate.conf`) OVERRIDES any key here; unset keys fall back to
# these defaults. See ~/.agents/QA_TOOLING.md for the full schema + precedence.
#
# VALUES for a check: block | warn | off
#   block = non-zero exit, commit refused (only for fast, near-zero-false-positive checks)
#   warn  = print to stderr, commit proceeds
#   off   = skip entirely
#
# Ast-grep rule source (SEVERABLE). Precedence: $GIT_GUARD_RULES_DIR env >
# this `rules_dir` key > bundled rules-examples/. Left UNSET here so a fresh
# public clone uses the shareable bundled examples. The local installer
# (install.sh) writes an absolute `rules_dir` pointing at a private rule corpus
# (e.g. ~/.claude/rules) into the DEPLOYED copy of this file, so this machine
# gets the full overlay while the committed default stays public-safe.
# rules_dir=
#
# Master switch
qa.enabled=on

# --- Filesystem hygiene (PII-safe, language-agnostic) ---
nul_cleanup=block          # NukeNul reserved-filename cleanup; mandatory hygiene

# --- Cross-language structural rules (ast-grep) ---
# astgrep.core runs core/ + security/ rules on ALL staged source files.
# astgrep.<lang> runs that language's rule dir on that language's staged files.
# The narrow BLOCK trio (rust avoid-static-mut / no-glob-reexport /
# panics-unsafe-with-panic) always blocks when astgrep is not 'off'; everything
# else auto-fixes (if the rule has fix:) or WARNs. See QA_TOOLING.md.
astgrep=warn               # master for ast-grep layer: warn|block|off (trio still blocks unless off)
astgrep_autofix=off        # OFF by default: a fix: like println!->tracing::info! would create a
                           # silently NON-COMPILING commit in repos without `tracing`. Opt-in
                           # per repo via .qa-gate.conf (astgrep_autofix=on) only where the fixes
                           # are known-safe. Detection (trio block + warn) is unaffected by this.

# --- Rust ---
rust.fmt=warn              # cargo fmt (staged scope advisory); NOT --all auto-restage
rust.clippy=off            # cargo clippy -D warnings: SLOW + most WIP repos don't build clean -> off by default

# --- Python ---
python.ruff_check=block    # ruff check (uses repo config if present, else minimal E,F)
python.ruff_format=warn    # ruff format: WARN if it would change staged files (no auto-restage of partial)
python.mypy=warn           # strict mypy needs full project context -> warn, not block
python.basedpyright=warn   # often absent -> warn/skip

# --- Shell ---
shell.shellcheck=block     # fast, high-signal on staged *.sh/*.bash

# --- C# ---
csharp.format=warn         # dotnet format if available

# --- PowerShell ---
# NOTE: powershell.astgrep is RETAINED FOR COMPATIBILITY BUT CANNOT FIRE. ast-grep
# has no PowerShell grammar: rules declaring `language: powershell` fail to parse
# and are validated out of the cache, and the `language: bash # PowerShell`
# workaround gates them to bash files, so a .ps1 never matches. Verified 2026-08-15
# — a .ps1 containing both `Invoke-Expression $x` and `iex $x` produced ZERO
# findings from no-invoke-expression.yml (severity: error, "critical security
# vulnerability"). Real PowerShell coverage is psscriptanalyzer, below.
powershell.astgrep=warn    # inert — see note above; kept so existing configs don't error
powershell.psscriptanalyzer=warn  # PSScriptAnalyzer on staged *.ps1/*.psm1/*.psd1 (~1.7s via pwsh).
                           # The security subset (PSAvoidUsingInvokeExpression,
                           # PSAvoidUsingPlainTextForPassword, ConvertToSecureStringWithPlainText,
                           # UserNameAndPasswordParams) BLOCKS regardless of this
                           # setting unless it is 'off' — mirrors the ast-grep BLOCK trio.

# --- Structured-data validation (cheap, real) ---
validate.json=block        # JSON parse on staged *.json
validate.yaml=warn         # YAML parse on staged *.yml/*.yaml (parser may be absent -> warn)

# --- Size guard ---
largefile=warn             # warn on staged files > largefile_kb (LFS repos vary)
largefile_kb=5120

# --- Quality mandate (docs/QA_TOOLING.md "Quality mandate"; hooks/common/mandate_scan.sh) ---
# VALUES: off | warn | changed | block
#   changed = block findings on lines this commit adds or modifies (old debt in a
#             touched file does not block); block = any finding in a staged file;
#   warn    = report changed-line findings, commit proceeds; off = skip the rule.
# Justified debt is recorded ON THE LINE: `# noqa: CODE  # SAFETY: <reason>` or
# `# ast-grep-ignore: <rule-id>  # SAFETY: <reason>`; a repo-wide backlog goes in
# .git-guard/mandate-baseline.json (checked at pre-push when present).
# These defaults must match mandate_scan.py RULES (tests/32-quality-mandate.t.sh).
mandate.enabled=on                 # master switch for this layer (independent of qa.enabled)
# mandate.vendored=dir/a,dir/b     # repo-declared vendored trees, exempt like vendor/ and external*/
mandate.pydantic_v1=block          # PY-01 pydantic.v1 imports, @validator/@root_validator, class Config, parse_obj/parse_raw
mandate.pydantic_v1_ambiguous=warn # PY-01 .dict() / .copy(update=) — the names exist outside pydantic
mandate.bare_except=block          # PY-06 ruff E722
mandate.blind_except=changed       # PY-06 ruff BLE001
mandate.except_pass=changed        # PY-06 ruff S110 + except...pass (logging does not exempt)
mandate.except_continue=changed    # PY-06 ruff S112 + except...continue
mandate.except_sentinel=changed    # PY-05 except returning None/False/""/[]/{} ("no None that drops the reason")
mandate.broad_suppress=changed     # PY-06 contextlib.suppress(Exception)
mandate.no_any=changed             # PY-03 ruff ANN401 + any explicit Any annotation/import
mandate.raise_from=changed         # PY-07 ruff B904
mandate.bare_exception_raise=changed  # PY-08 ruff TRY002
mandate.raise_without_message=changed # PY-08 raise X() / raise XError with no message
mandate.unchecked_subprocess=changed  # PY-13 ruff PLW1510
mandate.suppression_code=changed   # PY-09 ruff PGH003/PGH004 (blanket noqa / type: ignore)
mandate.suppression_reason=changed # PY-09 mandate noqa/ast-grep-ignore needs `SAFETY:` or `best-effort:`
mandate.str_enum_param=changed     # PY-04 mode/state/kind... typed as raw str/int
mandate.literal_enum=warn          # PY-04 Literal["a","b"] (vigil-ai-tpm recommends Literal; conflict noted)
mandate.magic_number=warn          # PY-04 ruff PLR2004
mandate.python_syntax=changed      # a file ruff cannot parse cannot be checked
mandate.rust_panic=changed         # RS-01 unwrap/expect/panic!/todo!/unimplemented! in non-test Rust

# --- preserve/* exemption (docs/QA_TOOLING.md "preserve/* exemption") ---
preserve_exemption=on      # on: preserve/* commits with a valid Preserve-Of: trailer run only
                           # the structural checks. off: they get the normal gates.
